# newsyslog(8) rotation for pewter running under freebsd/pewter (daemon -o).
# Install as /usr/local/etc/newsyslog.conf.d/pewter.conf.  Rotates daily at
# midnight, keeps 7 compressed logs; newsyslog sends SIGHUP to the daemon(8)
# supervisor in the pidfile, which reopens the log.
#
# logfilename		[owner:group]	mode	count	size	when	flags	[/pid_file]
/var/log/pewter.log	root:wheel	640	7	*	@T00	JC	/var/run/pewter.pid
